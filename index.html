const sb=(window.supabase&&!/YOUR_SUPABASE/.test(SUPABASE_URL+SUPABASE_ANON_KEY))?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true}}):null;
const BUCKET='vault';
const enc=new TextEncoder();
class Denied extends Error{}
class Invalid extends Error{}
const TYPES={txt:1,md:1,csv:1,json:1,pdf:1,png:1},TEXT=['txt','md','csv','json'],MAX=1048576,CATS=['Contract','HR','Finance','Engineering','Audit','Other'];
const MIME={txt:'text/plain',md:'text/markdown',csv:'text/csv',json:'application/json',pdf:'application/pdf',png:'image/png'};
const extOf=n=>n.includes('.')?n.split('.').pop().toLowerCase():'';

/* The database is the only place rules live (see supabase-schema.sql). Everything below is a thin
   client: it calls tv_* functions, which re-check account, role and grant on every call.
   The checks in checkFile() only give quick feedback and test file content, which the database cannot read. */
async function rpc(fn,args){
 const{data,error}=await sb.rpc(fn,args||{});
 if(error)throw new Error(error.message);
 if(!data||!data.ok){const e=data||{};throw new(e.kind==='denied'?Denied:Invalid)(e.error||'Request failed')}
 return data.data}

function checkFile(name,bytes,cat){
 if(typeof name!=='string'||!/^[\w\-. ()]{1,100}$/.test(name)||name.includes('..')||name.startsWith('.'))throw new Invalid('File name: 1-100 characters, letters, digits, space, dot, dash, underscore, brackets only');
 const ext=extOf(name);if(!TYPES[ext])throw new Invalid('File type .'+ext+' is not allowed (txt, md, csv, json, pdf, png)');
 if(!bytes.length)throw new Invalid('File is empty');if(bytes.length>MAX)throw new Invalid('File is larger than 1 MB');
 if(!CATS.includes(cat))throw new Invalid('Unknown category');
 const starts=a=>a.every((b,i)=>bytes[i]===b);
 if(ext==='pdf'&&!starts([0x25,0x50,0x44,0x46,0x2d]))throw new Invalid('Content is not a real PDF');
 if(ext==='png'&&!starts([0x89,0x50,0x4e,0x47]))throw new Invalid('Content is not a real PNG');
 if(TEXT.includes(ext)){let t;try{t=new TextDecoder('utf-8',{fatal:true}).decode(bytes)}catch{throw new Invalid('Text file is not valid UTF-8')}
  if(t.includes('\0'))throw new Invalid('Binary data inside a text file');if(ext==='json'){try{JSON.parse(t)}catch{throw new Invalid('Not valid JSON')}}}
 return ext}

const V={
 users:{},
 async refreshUsers(){const l=await rpc('tv_users');V.users=Object.fromEntries(l.map(u=>[u.id,u]))},
 async login(email,pw){
  const{error}=await sb.auth.signInWithPassword({email,password:pw});
  if(error){const notConf=/confirm/i.test(error.message||'');const x=new Denied(notConf?'Your email is not confirmed yet. Open the confirmation email we sent you, then sign in.':'Email or password is incorrect. Check both and try again.');x.badFields=notConf?['u']:['u','p'];throw x}

  if(!['owner','viewer'].includes(role))throw new Invalid('You can register as a document owner or a viewer; administrators are created by an administrator');
  if(pw.length<8||!/[a-zA-Z]/.test(pw)||!/\d/.test(pw))throw new Invalid('Password: at least 8 characters, with a letter and a digit');
  const free=await sb.rpc('tv_username_free',{p_username:id});
  if(free.data===false)throw new Invalid('That username is already taken');
  const{error}=await sb.auth.signUp({email,password:pw,options:{data:{username:id,name,role}}});
  if(error)throw new Invalid(error.message);
  await sb.auth.signOut().catch(()=>{})},
 async fetchBytes(path){const{data,error}=await sb.storage.from(BUCKET).download(path);if(error)throw new Denied('The file could not be fetched: '+error.message);return new Uint8Array(await data.arrayBuffer())},
 async stage(uid,ext,bytes){const path=uid+'/'+crypto.randomUUID();
  const{error}=await sb.storage.from(BUCKET).upload(path,new Blob([bytes],{type:MIME[ext]}),{contentType:MIME[ext],upsert:false});
  if(error)throw new Invalid('Upload failed: '+error.message);return path},
 async unstage(path){try{await sb.storage.from(BUCKET).remove([path])}catch{}},
 async purge(paths){try{await sb.storage.from(BUCKET).remove(paths);await rpc('tv_purged',{p_paths:paths})}catch{}},
 list(f){f=f||{};return rpc('tv_list',{p_q:f.q||null,p_owner:f.owner||null,p_cat:f.category||null,p_from:f.from||null,p_to:f.to||null})},
 async read(id){const r=await rpc('tv_read',{p_id:id});return{meta:r.meta,bytes:TEXT.includes(r.meta.ext)?await V.fetchBytes(r.path):null}},
 async download(id){const r=await rpc('tv_download',{p_id:id});return{name:r.name,bytes:await V.fetchBytes(r.path)}},
 detail(id){return rpc('tv_detail',{p_id:id})},
 async upload(uid,name,bytes,cat,vis,editors){
  const ext=checkFile(name,bytes,cat);const path=await V.stage(uid,ext,bytes);
  try{return await rpc('tv_upload',{p_name:name,p_path:path,p_cat:cat,p_vis:vis,p_editors:editors})}
  catch(e){await V.unstage(path);throw e}},
 async edit(uid,id,ch){
  let path=null;const ext=extOf(ch.name);
  if(ch.text!==ch.oldText){const bytes=enc.encode(ch.text);checkFile(ch.name,bytes,ch.category);path=await V.stage(uid,ext,bytes)}
  try{const r=await rpc('tv_edit',{p_id:id,p_name:ch.name,p_cat:ch.category,p_path:path});if(r&&r.old_path)await V.purge([r.old_path])}
  catch(e){if(path)await V.unstage(path);throw e}},
 async remove(id){const r=await rpc('tv_remove',{p_id:id});await V.purge([r.path])},
 grant:(id,t,p)=>rpc('tv_grant',{p_id:id,p_target:t,p_perm:p}),
 revoke:(id,t)=>rpc('tv_revoke',{p_id:id,p_target:t}),
 setVisibility:(id,v)=>rpc('tv_set_visibility',{p_id:id,p_vis:v}),
 adminView:()=>rpc('tv_admin_view'),
 setActive:(t,on)=>rpc('tv_set_active',{p_target:t,p_on:on}),
 setRole:(t,r)=>rpc('tv_set_role',{p_target:t,p_role:r}),
 approve:t=>rpc('tv_approve',{p_target:t}),
 reject:t=>rpc('tv_reject',{p_target:t}),
 docApprove:id=>rpc('tv_doc_approve',{p_id:id}),
 async docReject(id){const r=await rpc('tv_doc_reject',{p_id:id});await V.purge([r.path])},
 verifyChain:()=>rpc('tv_verify')
};
</script>

<h2>Audit trail of this document</h2>${logTable(detail.audit||[])}`:''}</div>`}

function logTable(rows){return`<div class="tw"><table><tr><th>#</th><th>Time</th><th>Who</th><th>Action</th><th>Document</th><th>Result</th><th>Detail</th></tr>${[...rows].reverse().slice(0,200).map(e=>`<tr><td>${e.seq}</td><td>${fmt(e.ts)}</td><td>${esc(e.actor_name||nm(e.actor)||'unknown')}</td><td>${esc(e.action)}</td><td>${esc(e.doc_name||'')}</td><td>${badge(e.outcome)}</td><td>${esc(e.detail)}</td></tr>`).join('')||'<tr><td class="m">Nothing yet.</td></tr>'}</table></div>`}

function uploadView(){return`<div class="card"><h2 style="margin-top:0">Upload a document</h2><form data-f="upload"><div class="row"><input type="file" name="file"><select name="category">${cats('Other')}</select></div>
<div class="m">Who can access this document?</div>
<div class="row"><select name="vis"><option value="everyone">Public: every owner can edit, every viewer can view</option><option value="private">Private: only the people I choose</option></select></div>
<div id="privopts" hidden><div class="m">Owners who can <b>edit</b> (you always can):</div><div class="row">${picker('ed',Object.values(V.users).filter(u=>u.role==='owner'&&u.approved&&u.active&&u.id!==me),'Select owners who can edit…')}</div>
<div class="m">Viewers who can <b>view</b>:</div><div class="row">${picker('vw',Object.values(V.users).filter(u=>u.role==='viewer'&&u.approved&&u.active),'Select viewers who can view…')}</div>
<div class="m">With nobody selected, only you and the administrator can open it.</div></div>
<div class="m">Or paste text instead of choosing a file:</div><div class="row"><input name="pname" placeholder="notes.txt" size="24"></div><textarea name="ptext" placeholder="Document text"></textarea>
<div class="row"><button class="p">Upload</button></div><div class="m">Allowed: txt, md, csv, json, pdf, png · max 1 MB · content must match the file type. An administrator must approve each upload before anyone else can see it.</div></form></div>`}

function pendingCard(){const p=Object.values(V.users).filter(u=>!u.approved);return`<div class="card"><h2 style="margin-top:0">Registrations waiting for approval (${p.length})</h2><div class="tw"><table>${p.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.username)}</td><td>${esc(u.role)}</td><td><button class="p" data-a="approve" data-u="${u.id}">Approve</button> <button class="d" data-a="reject" data-u="${u.id}">Reject</button></td></tr>`).join('')||'<tr><td class="m">No one is waiting.</td></tr>'}</table></div></div>`}
function uploadsCard(){const p=adm.docs.filter(d=>d.status==='pending');return`<div class="card"><h2 style="margin-top:0">Uploads waiting for approval (${p.length})</h2><div class="tw"><table>${p.map(d=>`<tr><td>${esc(d.name)}</td><td>${esc(nm(d.owner))}</td><td>${esc(d.category)}</td><td>${d.size} B</td><td>${fmt(d.created)}</td><td><button data-a="review" data-id="${d.id}">Review</button> <button class="p" data-a="docok" data-id="${d.id}">Approve</button> <button class="d" data-a="docno" data-id="${d.id}">Reject</button></td></tr>`).join('')||'<tr><td class="m">No uploads are waiting.</td></tr>'}</table></div></div>`}
function adminView(){if(!adm)return'<div class="m">Loading…</div>';const acts=['UPLOAD','UPLOAD_APPROVE','UPLOAD_REJECT','READ','DOWNLOAD','CHANGE','DELETE'],pm=['PERMISSION_GRANT','PERMISSION_REVOKE'];
 return`${showRoleReq?roleReqCard():''}${uploadsCard()}${pendingCard()}<div class="card"><h2 style="margin-top:0">Accounts</h2><div class="tw"><table>${Object.values(V.users).filter(u=>u.approved).map(u=>`<tr><td>${esc(u.name)}</td><td>${u.role==='admin'||u.id===me?esc(u.role):`<select data-r="${u.id}"><option value="viewer"${u.role==='viewer'?' selected':''}>Viewer</option><option value="owner"${u.role==='owner'?' selected':''}>Document owner</option></select> <button data-a="role" data-u="${u.id}">Change</button>`}</td><td>${u.active?'active':'deactivated'}</td><td>${u.id===me?'':`<button data-a="active" data-u="${u.id}" data-on="${u.active?0:1}">${u.active?'Deactivate':'Reactivate'}</button>`}</td></tr>`).join('')}</table></div></div>
<div class="card"><h2 style="margin-top:0">Document register</h2><div class="tw"><table><tr><th>Name</th><th>Owner</th><th>Category</th><th>Status</th><th>Access</th><th>Selected people</th></tr>${adm.docs.map(d=>`<tr><td>${esc(d.name)}</td><td>${esc(nm(d.owner))}</td><td>${esc(d.category)}</td><td>${esc(d.status)}</td><td>${d.visibility==='everyone'?'public':'private'}</td><td>${esc(Object.entries(d.acl).map(([u,p])=>nm(u)+' ('+p+')').join(', ')||'nobody')}</td></tr>`).join('')}</table></div></div>
<div class="card"><h2 style="margin-top:0">Document activity</h2>${logTable(adm.log.filter(e=>acts.includes(e.action)))}</div>
<div class="card"><h2 style="margin-top:0">Permission changes</h2>${logTable(adm.log.filter(e=>pm.includes(e.action)))}</div>
<div class="card"><div class="row"><button data-a="verify">Verify audit chain</button>${chain===null?'':chain===0?'<span class="pass">Intact: no entry has been altered.</span>':`<span class="fail">Entry #${chain} was altered.</span>`}</div><h2>Everything else (logins, refused attempts)</h2>${logTable(adm.log.filter(e=>!acts.includes(e.action)&&!pm.includes(e.action)))}</div>`}

function render(){const tabs=me?TABS[role()]:['login','register'];if(!tabs.includes(tab))tab=tabs[0];
 let h=`<header><div class="brand"><span class="logo">🔐</span><h1>TrustVault</h1></div><div class="row">${me?`${role()==='admin'?`<span class="bellw">${bellHTML()}</span>`:''}<button data-a="profile" title="My profile">${esc(nm(me))} <span class="b">${esc(role())}</span></button><button data-a="logout">Sign out</button>`:''}</div></header>
<nav>${tabs.filter(t=>t!=='profile').map(t=>`<button class="${t===tab?'on':''}" data-a="tab" data-t="${t}">${LBL[t]}</button>`).join('')}</nav>`;
 if(msg&&tab!=='login'&&tab!=='register'&&tab!=='profile')h+=msgBox();
 h+=({login:loginView,register:registerView,roles:rolesView,docs:()=>me?docsView():'',upload:uploadView,admin:adminView,profile:profileView,help:helpView})[tab]();
 const app=$('#app'),entering=tab!==lastTab;app.dataset.tab=tab;app.classList.toggle('enter',entering);lastTab=tab;app.innerHTML=h;initReveal(entering);if(entering)splitHeads();if(msg&&!msg.ok&&(tab==='login'||tab==='register'||tab==='profile')){const c=$('#signin')||$('#app .card');if(c)c.scrollIntoView({block:'center'})}}
function initReveal(animate){const els=document.querySelectorAll('.rv');
 if(!animate||!('IntersectionObserver' in window)){els.forEach(e=>e.classList.add('in'));return}
 const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{threshold:.12});els.forEach(e=>io.observe(e))}

document.addEventListener('click',e=>{const b=e.target.closest('.eye');if(!b)return;const w=b.parentElement,i=w.querySelector('input'),on=i.type==='password';i.type=on?'text':'password';w.classList.toggle('show',on);b.setAttribute('aria-label',on?'Hide password':'Show password');b.title=on?'Hide password':'Show password';i.focus()});
document.addEventListener('click',e=>{const b=e.target.closest('[data-pk]');
 if(!b){document.querySelectorAll('.pk-panel:not([hidden])').forEach(p=>{if(!p.parentElement.contains(e.target))p.hidden=true});return}
 const w=b.closest('.pick'),pn=w.querySelector('.pk-panel'),k=b.dataset.pk;
 if(k==='toggle'){document.querySelectorAll('.pk-panel').forEach(p=>{if(p!==pn)p.hidden=true});pn.hidden=!pn.hidden;if(!pn.hidden)w.querySelector('.pk-q').focus()}
 else{w.querySelectorAll('.pk-i:not([hidden]) input').forEach(i=>i.checked=k==='all');pkLabel(w)}});
function pkLabel(w){const c=[...w.querySelectorAll('.pk-i input:checked')].map(i=>i.dataset.nm);w.querySelector('.pk-lbl').textContent=c.length?c.length+' selected: '+c.join(', '):w.dataset.ph}
document.addEventListener('change',e=>{const w=e.target.closest('.pick');if(w&&e.target.matches('.pk-i input'))pkLabel(w)});
document.addEventListener('input',e=>{if(!e.target.matches('.pk-q'))return;const w=e.target.closest('.pick'),q=e.target.value.trim().toLowerCase();let n=0;
 w.querySelectorAll('.pk-i').forEach(i=>{const hit=!q||i.dataset.n.includes(q);i.hidden=!hit;if(hit)n++});w.querySelector('.pk-empty').hidden=n>0});
document.addEventListener('keydown',e=>{if(e.target.matches&&e.target.matches('.pk-q')){if(e.key==='Enter')e.preventDefault();if(e.key==='Escape')e.target.closest('.pk-panel').hidden=true}});
document.addEventListener('input',e=>{if(e.target.classList)e.target.classList.remove('bad')});
document.addEventListener('change',e=>{if(e.target.matches&&e.target.matches('select[name="vis"]')){const b=document.getElementById('privopts');if(b)b.hidden=e.target.value!=='private'}});
setInterval(async()=>{if(!me||busy||document.hidden)return;try{const old=bellItems().length,r0=V.users[me]&&V.users[me].role;inbox=await rpc('tv_role_inbox');await V.refreshUsers();
 if(V.users[me]&&V.users[me].role!==r0){render();return}
 if(bellItems().length!==old){const w=document.querySelector('.bellw');if(w)w.innerHTML=bellHTML()}}catch(e){}},30000);
function splitHeads(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
 document.querySelectorAll('.hero .big').forEach(h=>{let i=0;[...h.childNodes].forEach(c=>{
  if(c.nodeType===3){const f=document.createDocumentFragment();c.textContent.split(/(\s+)/).forEach(t=>{if(!t)return;
   if(/^\s+$/.test(t)){f.appendChild(document.createTextNode(' '));return}
   const w=document.createElement('span'),x=document.createElement('span');w.className='w';x.textContent=t;x.style.setProperty('--i',i++);w.appendChild(x);f.appendChild(w)});c.replaceWith(f)}
  else if(c.nodeType===1){c.style.setProperty('--i',i++);c.classList.add('wu')}})})}
(()=>{const rm=matchMedia('(prefers-reduced-motion:reduce)').matches,root=document.documentElement;
 /* scroll progress bar */
 const pr=document.createElement('div');pr.id='prog';document.body.appendChild(pr);let tk=0;
 addEventListener('scroll',()=>{if(tk)return;tk=requestAnimationFrame(()=>{tk=0;const m=root.scrollHeight-innerHeight;pr.style.transform='scaleX('+(m>0?Math.min(1,scrollY/m):0)+')'})},{passive:true});
 /* vault door intro with a 000 to 100 counter, once per visit */
 let seen=false;try{seen=sessionStorage.getItem('tv_intro')==='1'}catch(e){}
 if(!rm&&!seen){const it=document.createElement('div');it.id='intro';it.innerHTML='<div class="ct"><b id="ictr">000</b><span>Opening the vault…</span></div>';document.body.appendChild(it);
  root.style.setProperty('--wb','2000ms');let done=false;const t0=performance.now(),D=1500,ct=it.querySelector('#ictr');
  const end=()=>{if(done)return;done=true;try{sessionStorage.setItem('tv_intro','1')}catch(e){}it.classList.add('open');setTimeout(()=>{it.remove();root.style.setProperty('--wb','450ms')},1300)};
  const step=t=>{if(done)return;const p=Math.min(1,(t-t0)/D);ct.textContent=String(Math.round(100*(1-Math.pow(1-p,3)))).padStart(3,'0');if(p<1)requestAnimationFrame(step);else setTimeout(end,250)};
  requestAnimationFrame(step);it.addEventListener('click',end);setTimeout(end,4000)}
 if(rm)return;
 /* cursor ring that grows over clickable things */
 if(matchMedia('(hover:hover) and (pointer:fine)').matches){const c=document.createElement('div');c.id='cur';c.innerHTML='<svg viewBox="0 0 120 120"><path d="M60 8 100 24v32c0 26-17 46-40 56C37 102 20 82 20 56V24L60 8Z"/><path d="m42 60 13 13 25-27"/></svg>';document.body.appendChild(c);let x=0,y=0,cx=0,cy=0,on=false;
  addEventListener('mousemove',e=>{x=e.clientX;y=e.clientY;if(!on){on=true;cx=x;cy=y;c.classList.add('on')}},{passive:true});
  document.addEventListener('mouseover',e=>c.classList.toggle('hov',!!(e.target.closest&&e.target.closest('a,button:not(.eye),select,summary,label,input,textarea'))));
  root.addEventListener('mouseleave',()=>{on=false;c.classList.remove('on')});
  (function f(){cx+=(x-cx)*.18;cy+=(y-cy)*.18;c.style.transform='translate('+cx+'px,'+cy+'px) translate(-50%,-50%)';requestAnimationFrame(f)})()}
 /* main buttons lean toward the pointer */
 let mb=null;document.addEventListener('mousemove',e=>{const b=e.target.closest&&e.target.closest('button.p');if(mb&&mb!==b){mb.style.transform='';mb=null}if(!b)return;mb=b;const r=b.getBoundingClientRect();b.style.transform='translate('+((e.clientX-r.left-r.width/2)*.2)+'px,'+((e.clientY-r.top-r.height/2)*.3)+'px)'},{passive:true});
})();
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||busy)return;const a=b.dataset.a,id=b.dataset.id;
 act(async()=>{switch(a){
  case'tab':tab=b.dataset.t;showRoleReq=false;chain=null;keep={};bad=new Set();msg=null;confirmAcct=false;if(tab==='help'){try{await rpc('tv_role_seen')}catch(e){}}if(tab!=='docs'){sel=null;detail=null}break;
  case'logout':me=null;await sb.auth.signOut();V.users={};sel=null;detail=null;adm=null;docs=[];tab='login';keep={};bad=new Set();showRoleReq=false;break;
  case'clear':filt={};break;
  case'open':confirmDel=false;await openDoc(id);break;
  case'close':confirmDel=false;sel=null;detail=null;break;
  case'bell':bellOpen=!bellPrev;break;
  case'reviewroles':tab='admin';showRoleReq=true;chain=null;break;
  case'closeroles':showRoleReq=false;break;
  case'roleok':await rpc('tv_role_decide',{p_id:id,p_approve:true});note('Role change approved',true);break;
  case'roleno':await rpc('tv_role_decide',{p_id:id,p_approve:false});note('Role change rejected',true);break;
  case'profile':{const g=await sb.auth.getUser();myEmail=g.data&&g.data.user?g.data.user.email:'';tab='profile';sel=null;detail=null;keep={};bad=new Set();confirmAcct=false;break}
  case'delacct':confirmAcct=true;keep={};bad=new Set();break;
  case'delacctno':confirmAcct=false;keep={};bad=new Set();break;
  case'review':confirmDel=false;tab='docs';await openDoc(id);break;
  case'docok':await V.docApprove(id);note('Upload approved; it is now available',true);break;
  case'docno':await V.docReject(id);if(sel===id){sel=null;detail=null}note('Upload rejected and its file removed',true);break;
  case'rmrej':await V.remove(id);note('Rejected upload removed from your list',true);break;
  case'dl':{const f=await V.download(sel);const url=URL.createObjectURL(new Blob([f.bytes]));const l=document.createElement('a');l.href=url;l.download=f.name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);note('Downloaded. The download is recorded in the audit trail.',true);break}
  case'del':confirmDel=true;break;
  case'delno':confirmDel=false;break;
  case'delyes':confirmDel=false;await V.remove(sel);sel=null;detail=null;note('Document deleted',true);break;
  case'revoke':await V.revoke(sel,b.dataset.u);note('Access taken back; effective immediately',true);break;
  case'active':await V.setActive(b.dataset.u,b.dataset.on==='1');break;
  case'role':{const r=document.querySelector('select[data-r="'+b.dataset.u+'"]');await V.setRole(b.dataset.u,r.value);note('Role updated',true);break}
  case'approve':await V.approve(b.dataset.u);note('Account approved; they can sign in now',true);break;
  case'reject':await V.reject(b.dataset.u);note('Registration rejected and removed',true);break;
  case'verify':chain=await V.verifyChain();break;
  }})});

document.addEventListener('submit',e=>{const f=e.target.closest('[data-f]');if(!f)return;e.preventDefault();if(busy)return;const d=new FormData(f);
 act(async()=>{if(!sb)throw new Invalid('Supabase is not configured yet (see the top of this file)');switch(f.dataset.f){
  case'login':{keep=Object.fromEntries(d.entries());bad=new Set();const u=String(d.get('u')).trim(),pw=String(d.get('p'));
   const fail=(m,f)=>{bad=new Set(f);const x=new Invalid(m);x.title='Sign-in failed';return x};
   if(!u||!/^\S+@\S+\.\S+$/.test(u))throw fail(u?'Enter a valid email address':'Enter your email',['u']);
   if(!pw)throw fail('Enter your password',['p']);
   try{const p=await V.login(u,pw);me=p.id;keep={};bad=new Set();await V.refreshUsers();tab=role()==='admin'?'admin':'docs'}catch(e){bad=new Set(e.badFields||[]);e.title=e.title||'Sign-in failed';throw e}break}
  case'register':{keep=Object.fromEntries(d.entries());bad=new Set();
   try{if(d.get('p')!==d.get('p2'))throw new Invalid('The two passwords do not match');await V.register(d.get('email'),d.get('u'),d.get('name'),d.get('role'),d.get('p'))}
   catch(e){const m=String(e.message).toLowerCase();bad=new Set(/do not match/.test(m)?['p','p2']:/username/.test(m)?['u']:/full name/.test(m)?['name']:/password/.test(m)?['p']:/email|already registered/.test(m)?['email']:[]);throw e}
   keep={};bad=new Set();note('Account created. Confirm your email if you are asked to, then an administrator must approve it before you can sign in.',true);tab='login';break}
  case'rolereq':{await rpc('tv_role_request',{p_role:String(d.get('rr')),p_reason:String(d.get('why')||'').trim()||null});note('Request sent. The administrator will review it. Check the table below for the answer.',true);break}
  case'prof':{keep=Object.fromEntries(d.entries());bad=new Set();const nn=String(d.get('pn')||'').trim(),nu=String(d.get('pu')||'').trim().toLowerCase();
   if(nn.length<2||nn.length>60){bad=new Set(['pn']);throw new Invalid('Enter your full name (2-60 characters)')}
   if(!/^[a-z0-9_.-]{3,30}$/.test(nu)){bad=new Set(['pu']);throw new Invalid('Username: 3-30 characters, using letters, digits, dot, dash or underscore')}
   try{await rpc('tv_update_profile',{p_name:nn,p_username:nu})}catch(e){bad=new Set(/username/i.test(e.message)?['pu']:/name/i.test(e.message)?['pn']:[]);throw e}
   await V.refreshUsers();keep={};bad=new Set();note('Profile updated',true);break}
  case'chpw':{keep=Object.fromEntries(d.entries());bad=new Set();const cp=String(d.get('cp')||''),np=String(d.get('np')||''),np2=String(d.get('np2')||'');
   if(!cp){bad=new Set(['cp']);throw new Invalid('Enter your current password')}
   if(np.length<8||!/[a-zA-Z]/.test(np)||!/\d/.test(np)){bad=new Set(['np']);throw new Invalid('New password: at least 8 characters, with a letter and a digit')}
   if(np!==np2){bad=new Set(['np','np2']);throw new Invalid('The two new passwords do not match')}
   const{error:e1}=await sb.auth.signInWithPassword({email:myEmail,password:cp});
   if(e1){bad=new Set(['cp']);throw new Denied('Current password is incorrect')}
   const{error:e2}=await sb.auth.updateUser({password:np});
   if(e2){bad=new Set(['np']);throw new Invalid(e2.message)}
   keep={};bad=new Set();note('Password changed. Use the new password next time you sign in.',true);break}
  case'delacct':{keep=Object.fromEntries(d.entries());bad=new Set();const pw=String(d.get('dp')||'');
   if(!pw){bad=new Set(['dp']);throw new Invalid('Enter your password to confirm')}
   const{error:e1}=await sb.auth.signInWithPassword({email:myEmail,password:pw});
   if(e1){bad=new Set(['dp']);throw new Denied('Password is incorrect')}
   const r=await rpc('tv_delete_account');await V.purge(r.paths||[]);
   me=null;V.users={};sel=null;detail=null;adm=null;docs=[];keep={};bad=new Set();confirmAcct=false;myEmail='';
   await sb.auth.signOut({scope:'local'}).catch(()=>{});tab='login';note('Your account has been deleted. Those details can no longer be used to sign in.',true);break}
  case'search':filt={q:d.get('q'),owner:d.get('owner'),category:d.get('category'),from:d.get('from'),to:d.get('to')};break;
  case'edit':await V.edit(me,sel,{name:d.get('name'),category:d.get('category'),text:d.get('text'),oldText:detail.text});detail.text=d.get('text');note('Saved',true);break;
  case'vis':await V.setVisibility(sel,d.get('vis'));note('Visibility updated',true);break;
  case'grant':{const us=d.getAll('u');if(!us.length)throw new Invalid('Choose at least one person');for(const u of us)await V.grant(sel,u,d.get('perm'));note('Access granted to '+us.length+' '+(us.length>1?'people':'person'),true);break}
  case'upload':{const file=d.get('file');let name,bytes;if(file&&file.size){name=file.name;bytes=new Uint8Array(await file.arrayBuffer())}else{name=String(d.get('pname')||'').trim();bytes=enc.encode(String(d.get('ptext')||''))}
   const prv=d.get('vis')==='private',ed=prv?d.getAll('ed'):[],up=await V.upload(me,name,bytes,d.get('category'),d.get('vis'),ed);
   if(prv)for(const u of d.getAll('vw'))if(!ed.includes(u))await V.grant(up.id,u,'read');note('Uploaded “'+name+'”. It is waiting for administrator approval.',true);tab='docs';break}}})});

document.addEventListener('mousemove',e=>{const r=document.documentElement.style;r.setProperty('--px',((e.clientX/innerWidth-.5)*2).toFixed(2));r.setProperty('--py',((e.clientY/innerHeight-.5)*2).toFixed(2));const c=e.target.closest&&e.target.closest('.card');if(c){const b=c.getBoundingClientRect();c.style.setProperty('--x',(e.clientX-b.left)+'px');c.style.setProperty('--y',(e.clientY-b.top)+'px')}},{passive:true});

(async()=>{
 if(sb){
  sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'&&me){me=null;V.users={};sel=null;detail=null;tab='login';msg={t:'Signed out',m:'Your session ended. Please sign in again.'};render()}});
  try{const{data}=await sb.auth.getSession();
   if(data.session){const p=await rpc('tv_me');me=p.id;await V.refreshUsers();tab=role()==='admin'?'admin':'docs';await load()}}
  catch(e){me=null;try{await sb.auth.signOut()}catch{}}
 }
 if(!me)tab='login';
 render()})();
