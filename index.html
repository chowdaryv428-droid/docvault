.rv.in .grid .card{animation:up .6s cubic-bezier(.2,.7,.2,1) backwards}

<script id="core">
/* ---- Supabase settings: Dashboard > Project Settings > API ---- */
const SUPABASE_URL='https://nhepcmdrndeiygxhjevp.supabase.co';            // e.g. https://abcdxyz.supabase.co
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oZXBjbWRybmRlaXlneGhqZXZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM3NjkzNTMsImV4cCI6MjEwOTM0NTM1M30.TlXQ1GGJTSShId7hskAmAF8Sg2vLWhvVCjT3cYT8_NM';  // the public "anon" key (never the service_role key)

const sb=(window.supabase&&!/YOUR_SUPABASE/.test(SUPABASE_URL+SUPABASE_ANON_KEY))?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true}}):null;
const BUCKET='vault';
const enc=new TextEncoder();
class Denied extends Error{}
class Invalid extends Error{}
const TYPES={txt:1,md:1,csv:1,json:1,pdf:1,png:1},TEXT=['txt','md','csv','json'],MAX=1048576,CATS=['Contract','HR','Finance','Engineering','Audit','Other'];
const MIME={txt:'text/plain',md:'text/markdown',csv:'text/csv',json:'application/json',pdf:'application/pdf',png:'image/png'};
const extOf=n=>n.includes('.')?n.split('.').pop().toLowerCase():'';

/* The database is the only place rules live (see supabase-schema.sql). Everything below is a thin
   client: it calls tv_* functions, which re-check account, role and grant on every call.
   The checks in checkFile() only give quick feedback and test file content, which the database cannot read. */
async function rpc(fn,args){
 const{data,error}=await sb.rpc(fn,args||{});
 if(error)throw new Error(error.message);
 if(!data||!data.ok){const e=data||{};throw new(e.kind==='denied'?Denied:Invalid)(e.error||'Request failed')}
 return data.data}

function checkFile(name,bytes,cat){
 if(typeof name!=='string'||!/^[\w\-. ()]{1,100}$/.test(name)||name.includes('..')||name.startsWith('.'))throw new Invalid('File name: 1-100 characters, letters, digits, space, dot, dash, underscore, brackets only');
 const ext=extOf(name);if(!TYPES[ext])throw new Invalid('File type .'+ext+' is not allowed (txt, md, csv, json, pdf, png)');
 if(!bytes.length)throw new Invalid('File is empty');if(bytes.length>MAX)throw new Invalid('File is larger than 1 MB');
 if(!CATS.includes(cat))throw new Invalid('Unknown category');
 const starts=a=>a.every((b,i)=>bytes[i]===b);
 if(ext==='pdf'&&!starts([0x25,0x50,0x44,0x46,0x2d]))throw new Invalid('Content is not a real PDF');
 if(ext==='png'&&!starts([0x89,0x50,0x4e,0x47]))throw new Invalid('Content is not a real PNG');
 if(TEXT.includes(ext)){let t;try{t=new TextDecoder('utf-8',{fatal:true}).decode(bytes)}catch{throw new Invalid('Text file is not valid UTF-8')}
  if(t.includes('\0'))throw new Invalid('Binary data inside a text file');if(ext==='json'){try{JSON.parse(t)}catch{throw new Invalid('Not valid JSON')}}}
 return ext}

const V={
 users:{},
 async refreshUsers(){const l=await rpc('tv_users');V.users=Object.fromEntries(l.map(u=>[u.id,u]))},
 async login(email,pw){
  const{error}=await sb.auth.signInWithPassword({email,password:pw});
  if(error)throw new Denied('Invalid credentials');
  try{return await rpc('tv_login')}catch(e){await sb.auth.signOut();throw e}},
 async register(email,id,name,role,pw){
  id=String(id||'').trim().toLowerCase();name=String(name||'').trim();email=String(email||'').trim();pw=String(pw||'');
  if(!/^\S+@\S+\.\S+$/.test(email))throw new Invalid('Enter a valid email address');
  if(!/^[a-z0-9_.-]{3,30}$/.test(id))throw new Invalid('Username: 3-30 characters, lowercase letters, digits, dot, dash or underscore');
  if(name.length<2||name.length>60)throw new Invalid('Enter your full name (2-60 characters)');
  if(!['owner','viewer'].includes(role))throw new Invalid('You can register as a document owner or a viewer; administrators are created by an administrator');
  if(pw.length<8||!/[a-zA-Z]/.test(pw)||!/\d/.test(pw))throw new Invalid('Password: at least 8 characters, with a letter and a digit');
  const free=await sb.rpc('tv_username_free',{p_username:id});
  if(free.data===false)throw new Invalid('That username is already taken');
  const{error}=await sb.auth.signUp({email,password:pw,options:{data:{username:id,name,role}}});
  if(error)throw new Invalid(error.message);
  await sb.auth.signOut().catch(()=>{})},
 async fetchBytes(path){const{data,error}=await sb.storage.from(BUCKET).download(path);if(error)throw new Denied('The file could not be fetched: '+error.message);return new Uint8Array(await data.arrayBuffer())},
 async stage(uid,ext,bytes){const path=uid+'/'+crypto.randomUUID();
  const{error}=await sb.storage.from(BUCKET).upload(path,new Blob([bytes],{type:MIME[ext]}),{contentType:MIME[ext],upsert:false});
  if(error)throw new Invalid('Upload failed: '+error.message);return path},
 async unstage(path){try{await sb.storage.from(BUCKET).remove([path])}catch{}},
 async purge(paths){try{await sb.storage.from(BUCKET).remove(paths);await rpc('tv_purged',{p_paths:paths})}catch{}},
 list(f){f=f||{};return rpc('tv_list',{p_q:f.q||null,p_owner:f.owner||null,p_cat:f.category||null,p_from:f.from||null,p_to:f.to||null})},
 async read(id){const r=await rpc('tv_read',{p_id:id});return{meta:r.meta,bytes:TEXT.includes(r.meta.ext)?await V.fetchBytes(r.path):null}},
 async download(id){const r=await rpc('tv_download',{p_id:id});return{name:r.name,bytes:await V.fetchBytes(r.path)}},
 detail(id){return rpc('tv_detail',{p_id:id})},
 async upload(uid,name,bytes,cat,vis,editors){
  const ext=checkFile(name,bytes,cat);const path=await V.stage(uid,ext,bytes);
  try{return await rpc('tv_upload',{p_name:name,p_path:path,p_cat:cat,p_vis:vis,p_editors:editors})}
  catch(e){await V.unstage(path);throw e}},
 async edit(uid,id,ch){
  let path=null;const ext=extOf(ch.name);
  if(ch.text!==ch.oldText){const bytes=enc.encode(ch.text);checkFile(ch.name,bytes,ch.category);path=await V.stage(uid,ext,bytes)}
  try{const r=await rpc('tv_edit',{p_id:id,p_name:ch.name,p_cat:ch.category,p_path:path});if(r&&r.old_path)await V.purge([r.old_path])}
  catch(e){if(path)await V.unstage(path);throw e}},
 async remove(id){const r=await rpc('tv_remove',{p_id:id});await V.purge([r.path])},
 grant:(id,t,p)=>rpc('tv_grant',{p_id:id,p_target:t,p_perm:p}),
 revoke:(id,t)=>rpc('tv_revoke',{p_id:id,p_target:t}),
 setVisibility:(id,v)=>rpc('tv_set_visibility',{p_id:id,p_vis:v}),
 adminView:()=>rpc('tv_admin_view'),
 setActive:(t,on)=>rpc('tv_set_active',{p_target:t,p_on:on}),
 setRole:(t,r)=>rpc('tv_set_role',{p_target:t,p_role:r}),
 approve:t=>rpc('tv_approve',{p_target:t}),
 reject:t=>rpc('tv_reject',{p_target:t}),
 verifyChain:()=>rpc('tv_verify')
};
</script>

<script id="ui">
let lastTab=null,me=null,tab='docs',filt={},docs=[],sel=null,detail=null,msg=null,adm=null,chain=null,confirmDel=false,busy=false;
const $=q=>document.querySelector(q),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=i=>i?new Date(i).toLocaleString():'—',nm=id=>V.users[id]?V.users[id].name:id,role=()=>V.users[me].role;
const note=(m,ok,t)=>{msg={t:t||(ok?'OK':'Denied'),m,ok}};
const ROLES=[['Administrator','Approves or rejects new registrations, switches people between viewer and document owner, manages accounts (activate or deactivate), sees the activity log, permission changes and a register of documents (names, owners, who has access) and can verify the audit chain. Cannot read, download, change or delete document contents, and cannot upload, unless an owner shares a document with them.'],
['Document owner','Uploads documents, organises them (name, category), reads, edits and downloads their own documents, and is the only person who can delete a document they uploaded (no administrator, editor or other owner can), chooses who can view each upload (everyone, or only people they pick), keeps the list of other owners who can edit it and takes that back, and sees the audit trail of their own documents.'],
['Viewer','Sees every document marked visible to everyone, plus restricted documents shared with them. Can view and download, but never edit, delete, share or upload.']];
const TABS={admin:['admin','roles'],owner:['docs','upload','roles'],viewer:['docs','roles']};
const LBL={docs:'Documents',upload:'Upload',admin:'Administration',roles:'Roles',login:'Sign in',register:'Register'};

async function act(fn){msg=null;busy=true;try{await fn()}catch(e){if(e instanceof Denied||e instanceof Invalid)msg={t:e instanceof Denied?'Denied':'Rejected',m:e.message};else msg={t:'Error',m:e.message}}
 try{await load()}catch(e){if(!msg&&me)msg={t:'Error',m:e.message}}busy=false;render()}
async function load(){if(!me)return;await V.refreshUsers();
 if(tab==='docs')docs=await V.list(filt);
 if(role()==='admin'&&tab==='admin')adm=await V.adminView();
 if(sel)await refreshDetail()}
async function refreshDetail(){try{const d=await V.detail(sel);detail.meta=d.meta;detail.editors=d.editors;detail.grants=d.grants;detail.audit=d.audit}catch(e){sel=null;detail=null}}
async function openDoc(id){const r=await V.read(id);sel=id;detail={text:r.bytes?new TextDecoder().decode(r.bytes):null,meta:r.meta}}

const opt=(arr,cur,all)=>(all?`<option value="">${all}</option>`:'')+arr.map(([v,l])=>`<option value="${esc(v)}"${v===cur?' selected':''}>${esc(l)}</option>`).join('');
const cats=c=>opt(CATS.map(x=>[x,x]),c);
const badge=o=>`<span class="b ${esc(o)}">${esc(o)}</span>`;

function loginView(){return`<section class="hero"><div><span class="pill">🔒 Private by design · every action recorded</span>
<h2 class="big">Your documents, <span class="grad">locked down</span> and fully accounted for.</h2>
<p class="lead">Store, share and track sensitive files with role-based access, private storage and a tamper-evident audit trail.</p>
</div>
<div class="shield"><i></i><i></i><i></i><svg viewBox="0 0 120 120" fill="none"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c8cff"/><stop offset="1" stop-color="#34e3d0"/></linearGradient></defs><path d="M60 8 100 24v32c0 26-17 46-40 56C37 102 20 82 20 56V24L60 8Z" fill="url(#g)" opacity=".95"/><path d="m42 60 13 13 25-27" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg></div></section>
${sb?'':'<div class="msg"><b class="fail">Not configured:</b> open this file and fill in <code>SUPABASE_URL</code> and <code>SUPABASE_ANON_KEY</code> at the top of the first script (see SUPABASE_SETUP.md).</div>'}
<div class="card" id="signin"><h2 style="margin-top:0">Sign in to TrustVault</h2><form data-f="login"><div class="row">
<input name="u" type="email" placeholder="Email" autocomplete="email"><input name="p" type="password" placeholder="Password" autocomplete="current-password">
<button class="p">Sign in</button></div>
<div class="m">New here? Register, confirm your email if asked, then wait for an administrator to approve your account.</div></form></div>
<section class="sec rv"><h2>How it works</h2><p class="m">Three steps from sign-up to full visibility.</p><div class="grid">
<div class="card"><div class="num">STEP 1</div><div class="ico">📝</div><h3>Register &amp; get approved</h3><p class="m">Create an account; an administrator approves it before anyone can sign in.</p></div>
<div class="card"><div class="num">STEP 2</div><div class="ico">📤</div><h3>Upload &amp; choose who sees</h3><p class="m">Share with everyone, or only the people you pick, with view or edit access.</p></div>
<div class="card"><div class="num">STEP 3</div><div class="ico">🧾</div><h3>Track every access</h3><p class="m">Opens, downloads, edits and refused attempts are all written to the log.</p></div></div></section>
<section class="sec rv"><h2>Why TrustVault</h2><p class="m">Security rules live in the database, not in the browser.</p><div class="grid">
<div class="card"><div class="ico">🛡️</div><h3>Role-based access</h3><p class="m">Administrator, document owner and viewer, each with clear limits.</p></div>
<div class="card"><div class="ico">🗄️</div><h3>Private storage</h3><p class="m">Files sit in a private bucket and are released only to people with access.</p></div>
<div class="card"><div class="ico">⛓️</div><h3>Tamper-evident log</h3><p class="m">A hash-chained audit trail shows if any entry was altered.</p></div>
<div class="card"><div class="ico">⚡</div><h3>Instant control</h3><p class="m">Take access back and it takes effect immediately.</p></div></div></section>
<section class="sec rv"><h2>Questions</h2><p class="m">Quick answers.</p>
<details><summary>Can administrators read my documents?</summary><p>No. Administrators manage accounts and see a register and the activity log, but cannot open, download, edit or delete document contents unless an owner shares one with them.</p></details>
<details><summary>Which file types are allowed?</summary><p>txt, md, csv, json, pdf and png, up to 1 MB each. Text files can be edited in the app.</p></details>
<details><summary>What does “Verify audit chain” do?</summary><p>It recomputes every log entry’s fingerprint in the database and tells an administrator whether any entry has been changed.</p></details>
<details><summary>Who can delete a document?</summary><p>Only the owner who uploaded it.</p></details></section>
<section class="sec rv">${rolesView()}</section>
<div class="foot rv">🔐 TrustVault · access you control, history you can verify</div>`}
function registerView(){return`<div class="card"><h2 style="margin-top:0">Create an account</h2><form data-f="register"><div class="row"><input name="name" placeholder="Full name"><input name="u" placeholder="Username" autocomplete="username"></div>
<div class="row"><input name="email" type="email" placeholder="Email" autocomplete="email"></div>
<div class="row"><select name="role"><option value="viewer">Viewer (sees documents shared with me)</option><option value="owner">Document owner (uploads and shares)</option></select></div>
<div class="row"><input name="p" type="password" placeholder="Password" autocomplete="new-password"><input name="p2" type="password" placeholder="Repeat password" autocomplete="new-password"></div>
<div class="row"><button class="p">Register</button><button type="button" data-a="tab" data-t="login">Back to sign in</button></div>
<div class="m">Password: at least 8 characters with a letter and a digit. New accounts cannot sign in until an administrator approves them. Administrator accounts cannot be self-registered.</div></form></div>`}
function rolesView(){return`<div class="card"><h2 style="margin-top:0">What each role can do</h2>${ROLES.map(r=>`<p><b>${r[0]}.</b> ${r[1]}</p>`).join('')}<p class="m">Every request re-checks account status, role and the document’s grant list in the database; nothing is remembered between requests. Refused attempts are logged too.</p></div>`}

function docsView(){const list=docs;
 return`<div class="card"><form data-f="search"><div class="row"><input name="q" placeholder="Name contains…" value="${esc(filt.q)}">
<select name="owner">${opt(Object.values(V.users).filter(u=>u.role==='owner'&&u.approved).map(u=>[u.id,u.name]),filt.owner,'Any owner')}</select>
<select name="category">${cats(filt.category).replace('<option','<option value="">Any category</option><option')}</select>
<label class="m">from <input type="date" name="from" value="${esc(filt.from)}"></label><label class="m">to <input type="date" name="to" value="${esc(filt.to)}"></label>
<button class="p">Search</button><button type="button" data-a="clear">Clear</button></div></form>
<div class="tw"><table><tr><th>Name</th><th>Owner</th><th>Category</th><th>Created</th><th>Size</th><th>Your access</th><th></th></tr>
${list.map(d=>`<tr><td>${esc(d.name)}</td><td>${esc(nm(d.owner))}</td><td>${esc(d.category)}</td><td>${fmt(d.created)}</td><td>${d.size} B</td><td>${esc(d.access)}</td><td><button data-a="open" data-id="${d.id}">Open</button></td></tr>`).join('')||'<tr><td colspan="7" class="m">No documents available to you.</td></tr>'}</table></div></div>${detail?detailView():''}`}

function detailView(){const m=detail.meta,own=m.access==='owner',can=own||m.access==='edit';
 const others=Object.values(V.users).filter(u=>u.id!==me&&u.active&&u.approved);
 return`<div class="card"><div class="row"><h2 style="margin:0">${esc(m.name)}</h2><span class="b">${esc(m.access)}</span><span class="m">v${m.version} · ${esc(m.category)} · owner ${esc(nm(m.owner))} · ${m.visibility==='everyone'?'visible to everyone':'restricted'}${m.modified?' · changed '+fmt(m.modified):''}</span></div>
<div class="m">Can edit: ${detail.editors.map(u=>esc(nm(u))).join(', ')}</div><div class="row"><button data-a="dl">Download</button>${own?(confirmDel?'<span class="fail">Delete permanently for everyone?</span> <button class="d" data-a="delyes">Yes, delete</button> <button data-a="delno">Cancel</button>':'<button class="d" data-a="del">Delete</button>'):''}<button data-a="close">Close</button></div>
${can&&detail.text!==null?`<form data-f="edit"><div class="row"><input name="name" value="${esc(m.name)}" size="28"><select name="category">${cats(m.category)}</select></div><textarea name="text">${esc(detail.text)}</textarea><div class="row"><button class="p">Save changes</button></div></form>`:detail.text!==null?`<pre>${esc(detail.text)}</pre>`:'<div class="m">Binary document: use Download.</div>'}
${own?`<h2>Who can view and edit</h2><form data-f="vis"><div class="row"><select name="vis"><option value="everyone"${m.visibility==='everyone'?' selected':''}>Everyone can view</option><option value="private"${m.visibility==='private'?' selected':''}>Only people I choose can view</option></select><button>Update</button></div></form><div class="tw"><table>${(detail.grants||[]).map(g=>`<tr><td>${esc(nm(g.user))}</td><td>${esc(g.perm)}</td><td><button class="d" data-a="revoke" data-u="${g.user}">Take back</button></td></tr>`).join('')||'<tr><td class="m">Only you.</td></tr>'}</table></div>
<form data-f="grant"><div class="row"><select name="u">${opt(others.map(u=>[u.id,u.name+' ('+u.role+')']),'')}</select><select name="perm"><option>read</option><option>edit</option></select><button class="p">Grant access</button></div><div class="m">Edit can be given to document owners only. Read grants are for restricted documents.</div></form>
<h2>Audit trail of this document</h2>${logTable(detail.audit||[])}`:''}</div>`}

function logTable(rows){return`<div class="tw"><table><tr><th>#</th><th>Time</th><th>Who</th><th>Action</th><th>Document</th><th>Result</th><th>Detail</th></tr>${[...rows].reverse().slice(0,40).map(e=>`<tr><td>${e.seq}</td><td>${fmt(e.ts)}</td><td>${esc(e.actor_name||nm(e.actor)||'unknown')}</td><td>${esc(e.action)}</td><td>${esc(e.doc_name||'')}</td><td>${badge(e.outcome)}</td><td>${esc(e.detail)}</td></tr>`).join('')||'<tr><td class="m">Nothing yet.</td></tr>'}</table></div>`}

function uploadView(){return`<div class="card"><h2 style="margin-top:0">Upload a document</h2><form data-f="upload"><div class="row"><input type="file" name="file"><select name="category">${cats('Other')}</select></div>
<div class="row"><select name="vis"><option value="everyone">Everyone can view</option><option value="private">Only people I choose can view</option></select></div>
<div class="m">Other owners who can edit this document (you always can):</div><div class="row">${Object.values(V.users).filter(u=>u.role==='owner'&&u.approved&&u.active&&u.id!==me).map(u=>`<label><input type="checkbox" name="ed" value="${u.id}"> ${esc(u.name)}</label>`).join(' ')||'<span class="m">No other owners yet.</span>'}</div>
<div class="m">Or paste text instead of choosing a file:</div><div class="row"><input name="pname" placeholder="notes.txt" size="24"></div><textarea name="ptext" placeholder="Document text"></textarea>
<div class="row"><button class="p">Upload</button></div><div class="m">Allowed: txt, md, csv, json, pdf, png · max 1 MB · content must match the file type.</div></form></div>`}

function pendingCard(){const p=Object.values(V.users).filter(u=>!u.approved);return`<div class="card"><h2 style="margin-top:0">Registrations waiting for approval (${p.length})</h2><div class="tw"><table>${p.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.username)}</td><td>${esc(u.role)}</td><td><button class="p" data-a="approve" data-u="${u.id}">Approve</button> <button class="d" data-a="reject" data-u="${u.id}">Reject</button></td></tr>`).join('')||'<tr><td class="m">No one is waiting.</td></tr>'}</table></div></div>`}
function adminView(){if(!adm)return'<div class="m">Loading…</div>';const acts=['UPLOAD','READ','DOWNLOAD','CHANGE','DELETE'],pm=['PERMISSION_GRANT','PERMISSION_REVOKE'];
 return`${pendingCard()}<div class="card"><h2 style="margin-top:0">Accounts</h2><div class="tw"><table>${Object.values(V.users).filter(u=>u.approved).map(u=>`<tr><td>${esc(u.name)}</td><td>${u.role==='admin'||u.id===me?esc(u.role):`<select data-r="${u.id}"><option value="viewer"${u.role==='viewer'?' selected':''}>Viewer</option><option value="owner"${u.role==='owner'?' selected':''}>Document owner</option></select> <button data-a="role" data-u="${u.id}">Change</button>`}</td><td>${u.active?'active':'deactivated'}</td><td>${u.id===me?'':`<button data-a="active" data-u="${u.id}" data-on="${u.active?0:1}">${u.active?'Deactivate':'Reactivate'}</button>`}</td></tr>`).join('')}</table></div></div>
<div class="card"><h2 style="margin-top:0">Document register (no contents)</h2><div class="tw"><table><tr><th>Name</th><th>Owner</th><th>Category</th><th>Visible to</th><th>Edit / shared</th></tr>${adm.docs.map(d=>`<tr><td>${esc(d.name)}</td><td>${esc(nm(d.owner))}</td><td>${esc(d.category)}</td><td>${d.visibility==='everyone'?'everyone (not admins)':'restricted'}</td><td>${esc(Object.entries(d.acl).map(([u,p])=>nm(u)+' ('+p+')').join(', ')||'nobody')}</td></tr>`).join('')}</table></div></div>
<div class="card"><h2 style="margin-top:0">Document activity</h2>${logTable(adm.log.filter(e=>acts.includes(e.action)))}</div>
<div class="card"><h2 style="margin-top:0">Permission changes</h2>${logTable(adm.log.filter(e=>pm.includes(e.action)))}</div>
<div class="card"><div class="row"><button data-a="verify">Verify audit chain</button>${chain===null?'':chain===0?'<span class="pass">Intact: no entry has been altered.</span>':`<span class="fail">Entry #${chain} was altered.</span>`}</div><h2>Everything else (logins, refused attempts)</h2>${logTable(adm.log.filter(e=>!acts.includes(e.action)&&!pm.includes(e.action)))}</div>`}

function render(){const tabs=me?TABS[role()]:['login','register'];if(!tabs.includes(tab))tab=tabs[0];
 let h=`<header><div class="brand"><span class="logo">🔐</span><h1>TrustVault</h1></div><div class="row">${me?`<span>${esc(nm(me))} <span class="b">${esc(role())}</span></span><button data-a="logout">Sign out</button>`:''}</div></header>
<nav>${tabs.map(t=>`<button class="${t===tab?'on':''}" data-a="tab" data-t="${t}">${LBL[t]}</button>`).join('')}</nav>`;
 if(msg)h+=`<div class="msg"><b class="${msg.ok?'pass':'fail'}">${esc(msg.t)}:</b> ${esc(msg.m)}</div>`;
 h+=({login:loginView,register:registerView,roles:rolesView,docs:()=>me?docsView():'',upload:uploadView,admin:adminView})[tab]();
 const app=$('#app'),entering=tab!==lastTab;app.classList.toggle('enter',entering);lastTab=tab;app.innerHTML=h;initReveal(entering)}
function initReveal(animate){const els=document.querySelectorAll('.rv');
 if(!animate||!('IntersectionObserver' in window)){els.forEach(e=>e.classList.add('in'));return}
 const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{threshold:.12});els.forEach(e=>io.observe(e))}

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||busy)return;const a=b.dataset.a,id=b.dataset.id;
 act(async()=>{switch(a){
  case'tab':tab=b.dataset.t;chain=null;if(tab!=='docs'){sel=null;detail=null}break;
  case'logout':me=null;await sb.auth.signOut();V.users={};sel=null;detail=null;adm=null;docs=[];tab='login';break;
  case'clear':filt={};break;
  case'open':confirmDel=false;await openDoc(id);break;
  case'close':confirmDel=false;sel=null;detail=null;break;
  case'dl':{const f=await V.download(sel);const url=URL.createObjectURL(new Blob([f.bytes]));const l=document.createElement('a');l.href=url;l.download=f.name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);note('Downloaded. The download is recorded in the audit trail.',true);break}
  case'del':confirmDel=true;break;
  case'delno':confirmDel=false;break;
  case'delyes':confirmDel=false;await V.remove(sel);sel=null;detail=null;note('Document deleted',true);break;
  case'revoke':await V.revoke(sel,b.dataset.u);note('Access taken back; effective immediately',true);break;
  case'active':await V.setActive(b.dataset.u,b.dataset.on==='1');break;
  case'role':{const r=document.querySelector('select[data-r="'+b.dataset.u+'"]');await V.setRole(b.dataset.u,r.value);note('Role updated',true);break}
  case'approve':await V.approve(b.dataset.u);note('Account approved; they can sign in now',true);break;
  case'reject':await V.reject(b.dataset.u);note('Registration rejected and removed',true);break;
  case'verify':chain=await V.verifyChain();break;
  }})});

document.addEventListener('submit',e=>{const f=e.target.closest('[data-f]');if(!f)return;e.preventDefault();if(busy)return;const d=new FormData(f);
 act(async()=>{if(!sb)throw new Invalid('Supabase is not configured yet (see the top of this file)');switch(f.dataset.f){
  case'login':{const p=await V.login(String(d.get('u')).trim(),String(d.get('p')));me=p.id;await V.refreshUsers();tab=role()==='admin'?'admin':'docs';break}
  case'register':{if(d.get('p')!==d.get('p2'))throw new Invalid('The two passwords do not match');await V.register(d.get('email'),d.get('u'),d.get('name'),d.get('role'),d.get('p'));note('Account created. Confirm your email if you are asked to, then an administrator must approve it before you can sign in.',true);tab='login';break}
  case'search':filt={q:d.get('q'),owner:d.get('owner'),category:d.get('category'),from:d.get('from'),to:d.get('to')};break;
  case'edit':await V.edit(me,sel,{name:d.get('name'),category:d.get('category'),text:d.get('text'),oldText:detail.text});detail.text=d.get('text');note('Saved',true);break;
  case'vis':await V.setVisibility(sel,d.get('vis'));note('Visibility updated',true);break;
  case'grant':await V.grant(sel,d.get('u'),d.get('perm'));note('Access granted',true);break;
  case'upload':{const file=d.get('file');let name,bytes;if(file&&file.size){name=file.name;bytes=new Uint8Array(await file.arrayBuffer())}else{name=String(d.get('pname')||'').trim();bytes=enc.encode(String(d.get('ptext')||''))}
   await V.upload(me,name,bytes,d.get('category'),d.get('vis'),d.getAll('ed'));note('Uploaded “'+name+'”',true);tab='docs';break}}})});

document.addEventListener('mousemove',e=>{const r=document.documentElement.style;r.setProperty('--px',((e.clientX/innerWidth-.5)*2).toFixed(2));r.setProperty('--py',((e.clientY/innerHeight-.5)*2).toFixed(2));const c=e.target.closest&&e.target.closest('.card');if(c){const b=c.getBoundingClientRect();c.style.setProperty('--x',(e.clientX-b.left)+'px');c.style.setProperty('--y',(e.clientY-b.top)+'px')}},{passive:true});

(async()=>{
 if(sb){
  sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'&&me){me=null;V.users={};sel=null;detail=null;tab='login';msg={t:'Signed out',m:'Your session ended. Please sign in again.'};render()}});
  try{const{data}=await sb.auth.getSession();
   if(data.session){const p=await rpc('tv_me');me=p.id;await V.refreshUsers();tab=role()==='admin'?'admin':'docs';await load()}}
  catch(e){me=null;try{await sb.auth.signOut()}catch{}}
 }
 if(!me)tab='login';
 render()})();
</script>
</body>
